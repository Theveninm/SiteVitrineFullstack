<header class="header" [class.header--menu-open]="menuOpen()">
  <a class="header__brand" routerLink="/" (click)="closeMenu()">M.T</a>

  <!-- Bouton hamburger : visible uniquement en mobile (CSS). aria-* pour l'accessibilité. -->
  <button
    type="button"
    class="header__toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="header-nav"
    [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    (click)="toggleMenu()"
  >
    <span class="header__toggle-bar" aria-hidden="true"></span>
    <span class="header__toggle-bar" aria-hidden="true"></span>
    <span class="header__toggle-bar" aria-hidden="true"></span>
  </button>

  <!--
    Fond semi-transparent : clique = ferme le menu.
    Le contenu du site reste légèrement visible derrière.
  -->
  @if (menuOpen()) {
    <button
      type="button"
      class="header__backdrop"
      aria-label="Fermer le menu"
      (click)="closeMenu()"
    ></button>
  }

  <!--
    routerLinkActive ajoute la classe "header__link--active" quand la route courante
    correspond au lien. [routerLinkActiveOptions]="{ exact: true }" sur l'accueil évite
    que "/" reste actif quand on est sur "/projets" ou "/contact".
  -->
  <nav
    id="header-nav"
    class="header__nav"
    [class.header__nav--open]="menuOpen()"
  >
    <a
      class="header__link"
      routerLink="/parcours"
      routerLinkActive="header__link--active"
      (click)="closeMenu()"
      >Parcours</a
    >
    <a
      class="header__link"
      routerLink="/projets"
      routerLinkActive="header__link--active"
      (click)="closeMenu()"
      >Projets</a
    >
    <a
      class="header__link"
      routerLink="/ressources"
      routerLinkActive="header__link--active"
      (click)="closeMenu()"
      >Livres et outils</a
    >
    <a
      class="header__link"
      routerLink="/contact"
      routerLinkActive="header__link--active"
      (click)="closeMenu()"
      >Contact</a
    >
    <a
      class="header__link header__link--icon"
      [href]="githubUrl"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub"
      (click)="closeMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.483 0-.237-.009-.866-.013-1.7-2.782.604-3.369-1.341-3.369-1.341-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.272.098-2.65 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.378.203 2.397.1 2.65.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.936.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12c0-5.523-4.477-10-10-10Z"
        />
      </svg>
      <span class="header__link-label">GitHub</span>
    </a>
    <a
      class="header__link header__link--icon"
      [href]="'mailto:' + email"
      aria-label="Envoyer un e-mail"
      (click)="closeMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"
        />
      </svg>
      <span class="header__link-label">Envoyer un e-mail</span>
    </a>
  </nav>
</header>
