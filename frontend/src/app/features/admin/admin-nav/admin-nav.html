         endroit selon l'écran. -->
    <a
      class="admin-nav__tab"
      routerLink="/admin/ressources"

      >Livres &amp; outils</a
    >
    <a class="admin-nav__tab" routerLink="/admin/projets" routerLinkActive="admin-nav__tab--active"
      >Projets</a
    >
  </div>

  <button type="button" class="admin-button" (click)="logout()">Se déconnecter</button>
</nav>
