# Schéma (http/https) de la requête d'origine, à transmettre à l'API.
# NPM termine le TLS puis parle en HTTP à ce conteneur : ici, $scheme vaut donc TOUJOURS « http »,
# même pour un visiteur en HTTPS. Le vrai schéma arrive dans l'en-tête X-Forwarded-Proto posé par
# NPM : on le relaie tel quel. S'il est absent (accès direct à ce conteneur, en local sans NPM), on
# retombe sur $scheme.
#
# `map` calcule une variable à partir d'une autre, à la demande. $http_x_forwarded_proto est l'en-tête
# reçu (Nginx expose chaque en-tête en $http_<nom en minuscules, tirets remplacés par _>). La
# directive vit hors du bloc server : ce fichier est inclus dans le contexte `http` du nginx.conf
# de l'image, le seul où `map` est permis.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tout ce qui commence par /api part vers le conteneur de l'API, dans le même réseau Docker.
    # C'est ce qui permet à Nginx Proxy Manager de n'avoir qu'un seul hôte à connaître (ce
    # conteneur), et au frontend de n'appeler que des URL relatives : même origine, donc pas de
    # CORS.
    #
    # `^~` est indispensable : sans lui, une URL comme /api/images/logo.png serait captée par le
    # « location ~* \.(?:css|js|…|png…)$ » plus bas (une regex l'emporte sur un préfixe simple) et
    # cherchée parmi les fichiers statiques d'Angular au lieu d'être relayée à l'API.
    location ^~ /api {
        # Taille maximale d'une requête (1 Mo par défaut) : les images déposées dans le back-office
        # peuvent aller jusqu'à 5 Mo côté API. Nginx Proxy Manager a sa propre limite, plus large.
        client_max_body_size 6m;

        # 127.0.0.11 est le résolveur DNS interne de Docker. Sans lui, Nginx résoudrait « api »
        # une seule fois au démarrage et continuerait d'appeler l'ancienne IP si le conteneur de
        # l'API était recréé (typiquement après un redéploiement Portainer) — d'où des 502
        # jusqu'au redémarrage du frontend. `valid=10s` force une nouvelle résolution régulière.
        resolver 127.0.0.11 valid=10s;

        # Passer par une variable est ce qui oblige Nginx à résoudre le nom à chaque requête
        # plutôt qu'au démarrage. Contrepartie : avec une variable, l'URI n'est plus recopiée
        # automatiquement, il faut l'ajouter explicitement via $request_uri.
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        # $http_host et non $host : $host perd le port. En local (http://localhost:8082), l'API
        # construirait sinon l'adresse de retour de Google sans « :8082 », et Google la refuserait.
        proxy_set_header Host $http_host;
        # X-Forwarded-For est une liste d'adresses, la plus récente à droite, que chaque proxy
        # complète au lieu de l'écraser. NPM y a ajouté l'IP du visiteur ; $proxy_add_x_forwarded_for
        # y ajoute celle de NPM (l'adresse qui contacte ce conteneur). L'API reçoit donc
        # « visiteur, NPM » et, sachant qu'il y a deux proxys de confiance devant elle
        # (ForwardLimit = 2 dans Program.cs), remonte de deux crans pour retrouver le visiteur.
        #
        # X-Real-IP n'est pas redéfini : celui de NPM (l'IP du visiteur) est relayé tel quel. Le
        # réécrire avec $remote_addr y mettait l'IP de NPM. L'API, elle, ne lit que X-Forwarded-For.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Relayé depuis NPM, surtout pas $scheme : voir le `map` en tête de fichier.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # try_files : indispensable pour une SPA Angular. Sans ça, un accès direct
    # ou un refresh sur /projets ou /contact renvoie une 404 (le fichier
    # /projets n'existe pas côté serveur, seul le routing Angular côté client
    # sait le gérer) — on retombe donc toujours sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|ico|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
